<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ball Arena</title>

.home{min-height:84vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center}
.tiles{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}.tile{background:var(--card);color:var(--ink);border:1px solid var(--ln);border-radius:28px;width:150px;padding:22px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;font-size:16px}

.top{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.top h2{flex:1}.mut{color:var(--mut)}

canvas{display:block;width:min(100%,470px);aspect-ratio:1;margin:0 auto;border-radius:30px;border:2px solid #34343d;touch-action:none;background:#101014}
#ctl{text-align:center;margin-top:14px}#ctl .row{margin:10px 0}
.xb{position:fixed;top:14px;right:14px;width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;z-index:5}
.snd{position:fixed;left:14px;bottom:14px;display:flex;gap:8px;z-index:5}.snd button{width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center}

.rv{max-width:none!important;width:min(720px,94vw);background:none!important;border:0!important}.win{position:relative;overflow:hidden;height:130px;border-radius:30px;background:var(--card);border:1px solid var(--ln)}

.pg{display:grid;grid-template-columns:1fr;gap:14px}.p2{background:var(--card);border:1px solid var(--ln);border-radius:26px;padding:16px}.qr{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}.qr>div{flex:1}

.ck{cursor:pointer}.ck:hover{background:var(--card2)}.ph{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:8px}.pc{display:flex;flex-direction:column;align-items:center;max-width:64px}.pc small{font-size:10px;min-height:0;text-align:center}
.offer{display:grid;grid-template-columns:1fr 1fr 1.3fr 1fr 1fr;gap:12px;align-items:stretch}.std{box-shadow:inset 0 3px 0 var(--rc),0 0 0 2px var(--rc)}
body:before{content:'';position:fixed;inset:-100px;background:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 2px,transparent 2px 44px);animation:mv 16s linear infinite;pointer-events:none;z-index:-1}@keyframes mv{to{transform:translate(62px,62px)}}
.tile{animation:pop .5s both}.tile:nth-child(2){animation-delay:.07s}.tile:nth-child(3){animation-delay:.14s}.tile:nth-child(4){animation-delay:.21s}.tile:nth-child(5){animation-delay:.28s}.tile:nth-child(6){animation-delay:.35s}@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.94)}}
.bn{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:8;font:800 clamp(44px,11vw,110px) var(--f);letter-spacing:.1em;animation:bn 1.5s both;text-shadow:0 0 40px #fff8}@keyframes bn{0%{opacity:0;transform:translateX(-90px) scale(.8)}25%,70%{opacity:1;transform:none}100%{opacity:0;transform:translateX(90px) scale(1.1)}}
.sp2{animation:sp .7s}@keyframes sp{40%{transform:scale(1.9);color:#ffd45e}}
.vc{display:flex;gap:10px;justify-content:center}.vw{width:100px;height:130px;overflow:hidden;position:relative;border-radius:28px;background:var(--card);border:1px solid var(--ln)}.vw:after{content:'';position:absolute;left:0;right:0;top:50%;height:2px;background:#fff6}.vt{will-change:transform}.vi{height:100px;display:flex;justify-content:center;align-items:center}
@media(max-width:860px){.offer{grid-template-columns:1fr 1fr}.big{grid-column:span 2}.hd{flex-wrap:wrap}.mid{order:-1;width:100%}h1{font-size:40px}}
