const chSvg=(i,z=80)=>{const[a,d,l]=[['#8a8a96','#55555f','#c3c3cc'],['#5ea8ff','#2c6fb8','#a8d2ff'],['#b98aff','#7a4fc4','#dcc4ff'],['#ffbf4a','#c78512','#ffe19a']][i];return`<svg width="${z}" height="${z}" viewBox="0 0 100 100"><rect x="12" y="46" width="76" height="40" rx="14" fill="${a}"/><path d="M12 50V40a28 24 0 0128-24h20a28 24 0 0128 24v10z" fill="${l}"/><rect x="12" y="48" width="76" height="9" fill="${d}"/><rect x="42" y="44" width="16" height="22" rx="8" fill="${l}" stroke="${d}" stroke-width="3"/></svg>`};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');

const RN=['Common','Rare','Epic','Legendary','Mythic','Limited'],RC=['#b8bcc8','#5ea8ff','#b98aff','#ffbf4a','#ff6f9e','#5cf2d6'],PRICE=[50,150,400,1000,2500,0];
const CN={e:'Effect',z:'Zone',w:'Wall',h:'Handler',b:'Brawler',m:'Summoner'};
const AB={};`heavy:b:Tank:Huge and slow, but its touches hit hard.
armor:b:Tank:Takes 20% less damage.
shield:b:Tank:Blocks the first two touches.
thorns:b:Tank:Reflects part of touch damage.
anchor:b:Tank:Touches knock the enemy away.
regen:b:Tank:Slowly regenerates HP.
swift:b:Duelist:Moves faster than most.
rage:b:Duelist:Hits harder the lower its HP.
fury:b:Duelist:Every hit it takes boosts its damage, compounding.
charge:b:Duelist:Damage builds the longer it goes without hitting.
glass:b:Duelist:Hits very hard but takes extra damage.
vamp:b:Duelist:Heals from damage dealt.
grow:b:Duelist:Grows with every hit.
bounce:b:Duelist:Gets faster with each wall bounce.
frenzy:b:Duelist:Gets faster with every hit it lands.
overclock:b:Duelist:Gets faster and stronger as the round goes on.
phase:b:Trickster:Turns intangible for a moment.
dash:b:Trickster:Bursts forward every few seconds with 1.5x touch damage.
blink:b:Trickster:Teleports around the arena; arrival shocks nearby enemies for 5.
magnet:b:Trickster:Curves toward the enemy.
jitter:b:Trickster:Changes direction erratically.
drift:b:Trickster:Curves in lazy circles.
gamble:b:Trickster:Touches roll a random bonus or penalty.
burn:e:Burn:Touches ignite the enemy.
trail:e:Burn:Leaves a fire trail.
pois:e:Toxin:Touches stack poison.
bleed:e:Toxin:Touches cause a stacking bleed.
chill:e:Frost:Touches slow the enemy.
stun:e:Frost:Touches stun the enemy briefly.
weak:e:Hex:Touches weaken the enemy's damage.
curse:e:Hex:Touches make the enemy take extra damage.
sunder:e:Hex:Touches strip shields and armor.
zap:e:Ranged:Calls lightning on the enemy.
shoot:e:Ranged:Fires shots at the enemy.
volley:e:Ranged:Fires three-shot bursts.
homing:e:Ranged:Fires slow homing orbs.
slowf:z:Field:Leaves permanent slowing fields.
lava:z:Field:Drops burning lava pools.
healz:z:Field:Drops healing pools.
timef:z:Field:Slows time for enemies near it.
well:z:Gravity:Drops pulling wells.
push:z:Gravity:Drops repelling fields.
turret:w:Turret:Wall hits plant turrets that fire straight.
beam:w:Beam:Wall hits fire lasers across the arena.
spike:w:Trap:Wall hits grow spikes.
mine:w:Trap:Wall hits scatter mines.
web:w:Trap:Every wall touch anchors a web that stays attached to the ball and follows it.
wbomb:w:Trap:Wall hits can explode.
sword:h:Blade:A sword orbits it.
saw:h:Blade:Two fast saws orbit it.
lance:h:Blade:A long lance that always points where the ball is heading.
mace:h:Guard:A mace orbits it.
flail:h:Guard:A heavy flail swings wide.
buck:h:Guard:An orbiting buckler cuts damage and bashes enemies.
medic:h:Orb:An orbiting orb heals it.
forb:h:Orb:A fire orb ignites enemies.
drone:m:Swarm:Spawns chasing drones.
decoy:m:Swarm:Leaves decoys that explode near enemies.
split:m:Clone:Splits into two bodies with 50 HP each.
tail:m:Tail:Grows a wide, damaging tail.
cactus:w:Trap:When hit, throws 6 ricocheting spikes.
revive:b:Tank:Revives once at 35 HP.
rewind:b:Trickster:Rewinds HP to 4 seconds ago now and then.
copycat:b:Trickster:Copies an ability from the first enemy it hits.
swap:b:Trickster:Swaps places with the enemy, then strikes for 5.
mindbend:e:Hex:Reverses the enemy's direction.
lastbreath:b:Tank:Survives one lethal hit, then turns invulnerable.
paradox:e:Hex:Echoes recent damage taken back at the enemy.
blackhole:z:Gravity:Opens a growing black hole in the center.
mirror:b:Tank:Reflects every projectile.
forge:m:Clone:Splits into a forge and a sword body; touching upgrades the sword.
overload:b:Tank:Stores damage, then releases a shockwave.

siphon:e:Frost:Touches steal enemy speed.

slash:h:Blade:Every 7.5s slashes a 90-degree arc for 25 damage after a windup; a fast low-damage saw spins around it.

c.shadowBlur=o.burn>0?18:o.slow>0?16:o.inv>0?20:0;c.shadowColor=o.burn>0?'#ff8a3d':o.inv>0?'#fff':'#9fdcff';
if(im.complete&&im.naturalWidth)c.drawImage(im,-R,-R,R*2,R*2);else{c.fillStyle=col(o.b);c.beginPath();c.arc(0,0,R,0,7);c.fill()}c.shadowBlur=0;
if(o.fl>0){c.globalAlpha=o.fl*5;c.fillStyle='#fff';c.beginPath();c.arc(0,0,R,0,7);c.fill()}c.globalAlpha=dk;
c.strokeStyle=sc[o.team];c.lineWidth=3;c.beginPath();c.arc(0,0,R+3,0,7);c.stroke();if(o.sh>0){c.setLineDash([4,4]);c.beginPath();c.arc(0,0,R+8,0,7);c.stroke();c.setLineDash([])}
const mt=o.p.has('charge')?(o.chg-1)/1.6:o.p.has('overclock')?Math.min(1,(o.oc-1)/1):o.p.has('overload')?Math.min(1,o.ov/40):o.p.has('fury')?Math.min(1,Math.log(o.fu)/Math.log(3)):-1;
if(mt>=0){c.strokeStyle='#fff';c.lineWidth=4;c.beginPath();c.arc(0,0,R+9,-1.57,-1.57+6.28*mt);c.stroke()}c.restore();
if(o.hp>0){for(const it of o.it)held(c,o,it);c.font='800 11px Nunito,system-ui';c.textAlign='center';c.lineWidth=3;c.strokeStyle='#000';const tx=Math.ceil(o.hp)+(o.p.has('cell')?' · S'+(o.stg||0):'');c.strokeText(tx,o.x,o.y+o.r+16);c.fillStyle='#fff';c.fillText(tx,o.x,o.y+o.r+16);
const sl=statuses(o).slice(0,8),bw=sl.length*15;sl.forEach((s,i)=>{const bx=o.x-bw/2+i*15+7.5,by=o.y-o.r-13;c.fillStyle=s[2];c.beginPath();c.arc(bx,by,6.5,0,7);c.fill();c.fillStyle='#0b0b0d';c.font='800 7px Nunito,system-ui';c.fillText(s[1],bx,by+2.5)})}}
for(const t of G.th)if(t.k=='b'){c.fillStyle=t.sp?'#ffd45e':'#fff';c.beginPath();c.arc(t.x,t.y,t.big?9:t.sp?4:5,0,7);c.fill();c.strokeStyle=sc[t.o.team];c.lineWidth=1.5;c.stroke()}else if(t.k=='dr'){c.fillStyle=sc[t.o.team];c.strokeStyle='#fff';c.lineWidth=1.5;c.beginPath();c.arc(t.x,t.y,6,0,7);c.fill();c.stroke()}
for(const p of G.pt){if(p.ring){const k=1-p.t/p.T;c.strokeStyle=p.c;c.globalAlpha=1-k;c.lineWidth=4;c.beginPath();c.arc(p.x,p.y,p.R*k,0,7);c.stroke();c.globalAlpha=1}else{c.globalAlpha=Math.min(1,p.t*3);c.fillStyle=p.c;c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill();c.globalAlpha=1}}
c.textAlign='center';for(const x of G.tx){c.globalAlpha=Math.min(1,x.t*2);const st=x.st||'hit';let X=x.x+(x.sh?Math.sin(x.t*70)*2:0),Y=x.y,fs=x.fs||15;
if(st=='crit')fs*=1+Math.max(0,x.t-.8)*2.4;if(st=='flame')X+=Math.sin(x.t*24)*4;if(st=='void')X+=Math.cos(x.t*14)*5;if(st=='pop')c.globalAlpha=Math.min(1,x.t*1.6);
c.font=`${st=='mag'||st=='web'||st=='void'?'italic ':''}800 ${fs}px Nunito,system-ui`;
if(st=='flame'||st=='crit'){c.shadowColor=x.ol||x.c;c.shadowBlur=st=='crit'?14:8}
if(x.ol||st=='crit'||st=='pop'||st=='laser'){c.lineWidth=st=='crit'?5:3;c.strokeStyle=x.ol||'#000';c.strokeText(x.s,X,Y)}
c.fillStyle=x.c||'#fff';c.fillText(x.s,X,Y);c.shadowBlur=0}c.globalAlpha=1;
if(G.ph=='aim')for(const x of G.f.filter(o=>o.team==0&&!o.tw)){const a=x.ang||0,sel=G.mine&&G.mine[G.ai]==x,X=x.x+Math.cos(a)*100,Y=x.y+Math.sin(a)*100;c.globalAlpha=sel?1:.4;c.strokeStyle='#fff';c.lineWidth=sel?4:3;c.setLineDash([2,10]);c.beginPath();c.moveTo(x.x,x.y);c.lineTo(X,Y);c.stroke();c.setLineDash([]);c.beginPath();c.arc(X,Y,6,0,7);c.stroke();if(sel){c.beginPath();c.arc(x.x,x.y,x.r+8,0,7);c.stroke()}c.globalAlpha=1}
if(G.frz>0){c.fillStyle='rgba(92,242,214,.12)';c.fillRect(0,0,500,500)}if(G.kf>0){c.fillStyle='rgba(255,255,255,'+G.kf*.6+')';c.fillRect(-20,-20,640,640)}c.restore()}
sndUI();home();
